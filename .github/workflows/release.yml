name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    # secrets are not available in step-level `if`, so mirror the values we
    # need into env once at the job level and use env in step conditions.
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate helper script
        run: bash -n serve-drop.sh

      - name: Import signing certificate
        if: env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain

      - name: Stage clean app bundle
        run: |
          rm -rf dist
          mkdir -p dist/dashboard.app
          cp -R Contents dist/dashboard.app/Contents

      - name: Sign app bundle
        if: env.HAS_APPLE_CERT == 'true'
        run: |
          (cd dist/dashboard.app && ../../sign.sh)
          codesign --verify --deep --strict --verbose=2 dist/dashboard-signed.app

      - name: Package app bundle
        run: |
          if [ -d dist/dashboard-signed.app ]; then
            app_path=dist/dashboard-signed.app
          else
            app_path=dist/dashboard.app
          fi

          # Repackage under the final app name so the archive unpacks as
          # dashboard.app, not dashboard-signed.app.
          package_dir=$(mktemp -d)
          cp -R "$app_path" "$package_dir/dashboard.app"
          ditto -c -k --keepParent "$package_dir/dashboard.app" "dashboard-${GITHUB_REF_NAME}.zip"
          rm -rf "$package_dir"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dashboard-${{ github.ref_name }}.zip
          generate_release_notes: true
