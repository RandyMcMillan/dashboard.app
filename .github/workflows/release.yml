name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate helper script
        run: bash -n serve-drop.sh

      - name: Import signing certificate
        if: ${{ secrets.APPLE_CERTIFICATE != '' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain

      - name: Stage clean app bundle
        run: |
          rm -rf dist
          mkdir -p dist/dashboard.app
          cp -R Contents dist/dashboard.app/Contents

      - name: Sign app bundle
        if: ${{ secrets.APPLE_CERTIFICATE != '' }}
        run: |
          (cd dist/dashboard.app && ../../sign.sh)

      - name: Notarize app bundle
        if: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.NOTARY_PASSWORD != '' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          APPLE_ID="${APPLE_ID:-randymcmillan1@mac.com}"
          TEAM_ID="${TEAM_ID:-M684FYCYG6}"
          : "${NOTARY_PASSWORD:?NOTARY_PASSWORD is required}"

          APP_PATH="dist/dashboard-signed.app"
          NOTARIZE_ZIP="dist/dashboard-notarize.zip"

          ditto -c -k --keepParent "$APP_PATH" "$NOTARIZE_ZIP"
          xcrun notarytool submit "$NOTARIZE_ZIP" \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$NOTARY_PASSWORD" \
            --wait
          xcrun stapler staple "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"

      - name: Package app bundle
        run: |
          if [ -d dist/dashboard-signed.app ]; then
            app_path=dist/dashboard-signed.app
          else
            app_path=dist/dashboard.app
          fi
          ditto -c -k --keepParent "$app_path" "dashboard-${GITHUB_REF_NAME}.zip"

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Dashboard ${GITHUB_REF_NAME}" \
            --generate-notes \
            "dashboard-${GITHUB_REF_NAME}.zip"